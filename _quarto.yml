project:
  type: book
  output-dir: docs
  # The ozed data is copied into docs/ so it is downloadable straight from
  # fun2debug.njtierney.com/data/. Attendees are on machines where cloning
  # from GitHub is awkward, and a plain HTTPS download from the course site
  # they are already reading is the path of least resistance.
  resources:
    - data/

# Applied to every chapter. linkate collects each chapter's links and lists
# them at the end. Set here rather than per-chapter so they cannot drift.
filters:
  - linkate
  # The chapter overview box. HTML gets it from chapter-overview.scss;
  # this is the LaTeX half, and it is a no-op in every other format.
  - overview-box.lua

book:
  title: "Introduction to Functions and Debugging"
  site-url: https://fun2debug.njtierney.com
  author: "Nicholas Tierney"
  repo-url: https://github.com/njtierney/fun2debug
  repo-branch: main
  repo-actions: [edit, issue]
  date: "2026-08-31"
  page-footer: "Copyright 2026, Nicholas Tierney"
  page-navigation: true
  search: true
  # PDF is OFF. HTML only. To turn it back on, uncomment the line below and
  # the pdf block at the bottom of this file. Both are commented with a single
  # leading `#` at column zero, so `sed 's/^#//'` on those lines restores the
  # indentation exactly. Do not re-comment them by stripping indentation, that
  # is how the block got mangled on 31 Aug.
  # downloads: [pdf]
  # The book opens and closes on the same idea: chapter 1 is why you should
  # not have to re-read your own code, chapter 7 is who does the re-reading.
  chapters:
    - "index.qmd"
    - "setup.qmd"
    # Uncommented on the rewrite branch only, so the drafts can be read and
    # rendered locally. main keeps them commented out because that branch
    # deploys to the public site.
    - "dont-re-read-yourself.qmd"
    - "anatomy-of-a-function.qmd"
    # - "outside-in-inside-out.qmd"
    # - "looking-inside-a-function.qmd"
    # - "from-script-to-functions.qmd"
    # - "measure-before-you-optimise.qmd"
    # - "writing-for-your-future-self.qmd"

# Only `##` and above get a number.
number-depth: 2

format:
  html:
    theme:
      - cosmo
      - measured/_measured-palette.scss    # Dark2 colours
      - measured/_measured-structure.scss  # code blocks, callout shape
      - measured/_measured-house.scss      # what each callout type means
      - measured/measured-legible.scss     # Atkinson Hyperlegible + Fira Code
      - book-grid.scss                     # book column is narrower than a website
      - chapter-overview.scss              # the box each chapter opens with
    code-copy: true
    code-line-numbers: true
    toc: true
    # `code-overflow: wrap` is deliberately NOT set. measured sizes blocks
    # to 80 characters and scrolls beyond that; wrapping instead would
    # destroy the indentation that shows the shape of a pipeline.
  # PDF. Plain KOMA scrbook with wide margins, NOT tufte-book - see the note
  # at the top of pdf-preamble.tex for why. Enabled 30 Aug 2026, turned off on
  # the morning of the 31st, turned back on the same afternoon for printing.
  # The settings below are the ones rbestpractices arrived at, and the comments
  # are the reasons they cannot be simplified away.
#  pdf:
#    documentclass: scrbook
#    classoption: [a4paper]
#    include-in-header: pdf-preamble.tex
#    keep-tex: true
    # The mono font needs box-drawing glyphs. The project layout tree in
    # "Getting set up" uses U+2500, U+251C, U+2514 and U+2502, and a font
    # without them drops every one silently, leaving an indented list of
    # names with no structure. TinyTeX ships no such font, so the machine
    # rendering this needs Fira Code installed - see .github/workflows/.
#    monofont: "Fira Code"
    # The margin is the point of this layout. Figure captions go out there,
    # and what is left is room to write on a printed page.
    #
    # `reference-location: margin` would put footnotes out there too, and it
    # is deliberately NOT set: on the rbestpractices book it makes Quarto's
    # own filter die with "attempt to get length of a Block value". Narrowed
    # to that one option - every other margin setting is fine - but the cause
    # is still unknown, so it stays off here too.
#    cap-location: margin
#    geometry:
#      - left=2.2cm
#      - right=7cm
#      - top=2.5cm
#      - bottom=2.5cm
#      - marginparwidth=5.2cm
#      - marginparsep=0.6cm
