on:
  push:
    branches: main

name: Render and Publish

# you need these permissions to publish to GitHub pages
permissions:
    contents: write
    pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The PDF is part of the book render, so if it fails the HTML deploy
      # fails with it. It needs a mono font with box-drawing glyphs, because
      # the project layout tree in "Setup" uses U+2500, U+251C, U+2514 and
      # U+2502 - a font without them drops every one silently, leaving an
      # indented list of names with no structure. TinyTeX ships no such font,
      # so install one. Added 30 Aug 2026 with `downloads: [pdf]`; this is the
      # step that keeps the PDF from taking the site down, and rbestpractices
      # learned that the hard way on 3 Aug 2026.
      - name: Install Fira Code
        run: sudo apt-get update && sudo apt-get install -y fonts-firacode

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
          # To install LaTeX to build PDF book

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Make sure you have a valid DESCRIPTION file
      - uses: r-lib/actions/setup-r-dependencies@v2

      # NOTE: If Publishing to GitHub Pages, set the permissions correctly (see top of this yaml)
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions

