<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t2 d2">
<title id="t2">Passing arguments by position and by name</title>
<desc id="d2">The definition pct_studying with arguments data and age is shown at the top. Below it three calls that all return the same answer. The first passes both values by position and is marked by position, with the note that you have to know the definition to read it. The second names both arguments and is marked by name, the habit worth having. The third names both but puts them in the opposite order, and is marked by name, any order, because naming makes order irrelevant.</desc>
<defs><style>
 .code{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:20px}
 .small{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:17px}
 .head{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:18px;font-weight:bold}
 .desc{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px}
 .cap{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;letter-spacing:0.04em}
</style></defs>
<rect width="940" height="440" fill="#ffffff"/>

<text class="cap" x="40" y="42" fill="#4a5160">THE DEFINITION</text>
<rect x="36" y="56" width="500" height="34" rx="6" fill="#fbfbfb" stroke="#e6e8eb"/>
<text class="small" x="50" y="79" fill="#1b2733">pct_studying &lt;- function(data, age)</text>
<path d="M 36,112 L 904,112" stroke="#e6e8eb" stroke-width="1.5"/>

<text class="cap" x="40" y="146" fill="#4a5160">THREE CALLS, ONE ANSWER</text>

<rect x="36" y="164" width="570" height="40" rx="7" fill="#D95F02" opacity="0.10"/>
<text class="code" x="52" y="191" fill="#1b2733">pct_studying(tas_2023, "15_19")</text>
<text class="head" x="624" y="184" fill="#C25502">By position</text>
<text class="desc" x="624" y="205" fill="#4a5160">You have to know the definition to read it.</text>

<rect x="36" y="234" width="570" height="40" rx="7" fill="#1B9E77" opacity="0.14"/>
<text class="code" x="52" y="261" fill="#1b2733">pct_studying(data = tas_2023, age = "15_19")</text>
<text class="head" x="624" y="254" fill="#178665">By name</text>
<text class="desc" x="624" y="275" fill="#4a5160">The habit worth having.</text>

<rect x="36" y="304" width="570" height="40" rx="7" fill="#1B9E77" opacity="0.14"/>
<text class="code" x="52" y="331" fill="#1b2733">pct_studying(age = "15_19", data = tas_2023)</text>
<text class="head" x="624" y="324" fill="#178665">By name, any order</text>
<text class="desc" x="624" y="345" fill="#4a5160">Naming makes the order irrelevant.</text>

<text class="desc" x="40" y="398" fill="#4a5160">All three give the same answer. What differs is how much you already have to know in order to read the line.</text>
</svg>
