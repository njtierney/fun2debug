<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-labelledby="t d">
<title id="t">Two lines out of twenty</title>
<desc id="d">Four copies of the same script side by side, drawn as rows of grey bars rather than readable code. In every copy the top two rows are coloured, a different colour in each copy, and the remaining eighteen rows are identical grey. A label underneath reads: two lines changed, eighteen ran again anyway, four times over. The picture shows that almost all of the work was re-run by hand for the sake of two lines.</desc>
